name: Publish immutable OTA binaries
on:
  push:
    branches: [main]
    paths: ['ota-inbox/**', 'tools/publish_ota.py', 'tests/test_publish_ota.py', '.github/workflows/publish-ota.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: immutable-ota-distribution
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify inbox and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s tests -v
          python3 tools/publish_ota.py
